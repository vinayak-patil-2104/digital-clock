<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Digital clock website">
    <title>Digital Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <img id="logo" src="images/minimalist-teal-clock-icon.png" alt="clock-icon">
        <div class="header-text">
            <h1 id="header-title">Digital Clock</h1>
            <h2 id="header-sub-title">a portfolio project</h2>
        </div>
        <div class="date-and-day">
            <p id="header-date">Date</p>
            <p id="header-day">Day</p>
        </div>
    </header>
    <main>
        <section class="main-text">
            <div class="outline-box">
                <p id="time-text">Time</p>
            </div>
            <p id="greetings-text">Greetings</p>
        </section>
    </main>
    <footer>
        <p id="footer-text">Design and Developed by <strong> Vinayak </strong>😎</p>
    </footer>
</body>

</html>
